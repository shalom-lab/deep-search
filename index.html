<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>DeepSearch · DeepSeek 网页搜索与抓取</title>
    <meta name="description" content="BYOK 模式下的 DeepSeek 网页搜索（/v1/tools/search）与网页抓取（/v1/tools/fetch）工作台" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='14' r='9' fill='none' stroke='%234f8cff' stroke-width='3'/%3E%3Cpath d='M21 21l7 7' stroke='%234f8cff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // 在首屏绘制前定好主题，避免白/黑闪烁
      (function () {
        try {
          var t = localStorage.getItem('deepseek-deepsearch-theme');
          if (!t) {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
